name: "CI/CD DevSecOps — flag-service (Python)"

on:
  push:
    branches: [ "main" ]
    paths:
      - "flag-service/**"
      - ".github/workflows/flag-service-ci.yaml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "flag-service/**"
      - ".github/workflows/flag-service-ci.yaml"
  workflow_dispatch:

permissions:
  contents: write

env:
  SERVICE_NAME: flag-service
  AWS_REGION: us-east-1
  PYTHON_VERSION: "3.12"

jobs:
  # ============================================================================
  # ESTÁGIO 1: Build & Unit Test
  # ============================================================================
  build-and-unit-test:
    name: "1. Build & Unit Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./flag-service
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: flag-service/requirements.txt

      - name: Instalar dependências e validar compilação
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile app.py

      - name: Executar Testes Unitários
        run: python -m unittest discover -v

  # ============================================================================
  # ESTÁGIO 2: Linter / Static Analysis (Flake8)
  # ============================================================================
  linter-static-analysis:
    name: "2. Linter / Static Analysis (Flake8)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./flag-service
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Rodar Flake8 Linter
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-complexity=15 --max-line-length=140 --statistics

  # ============================================================================
  # ESTÁGIO 3: Security Scan — SAST (Bandit) & SCA (Trivy FS)
  # Regra de Bloqueio: Falha se vulnerabilidade CRÍTICA/ALTA for encontrada
  # ============================================================================
  security-scan-sast-sca:
    name: "3. Security Scan (SAST Bandit & SCA Trivy)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "SAST — Bandit (Static Application Security Testing)"
        working-directory: ./flag-service
        run: |
          pip install bandit
          bandit -r app.py -ll -ii

      - name: "SCA — Trivy FS Scan (Bloqueio em Vulnerabilidades CRITICAL)"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "./flag-service"
          scanners: "vuln"
          severity: "CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

  # ============================================================================
  # ESTÁGIO 4: Docker Build, Container Scan (Trivy), Push ECR & GitOps Update
  # ============================================================================
  docker-build-push-gitops:
    name: "4. Docker Build, Trivy Image Scan, Push ECR & GitOps"
    runs-on: ubuntu-latest
    needs:
      - build-and-unit-test
      - linter-static-analysis
      - security-scan-sast-sca
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout do repositório completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Gerar tag imutável com Commit Hash (v1.0.0-sha)
        id: vars
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_TAG="v1.0.0-${SHORT_SHA}"
          ECR_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.SERVICE_NAME }}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "ecr_uri=${ECR_URI}" >> $GITHUB_OUTPUT

      - name: Construir imagem Docker
        working-directory: ./flag-service
        run: |
          docker build -t ${{ steps.vars.outputs.ecr_uri }}:${{ steps.vars.outputs.image_tag }} \
                       -t ${{ steps.vars.outputs.ecr_uri }}:latest .

      - name: "Container Scan — Trivy Image (Bloqueio em CRITICAL)"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ steps.vars.outputs.ecr_uri }}:${{ steps.vars.outputs.image_tag }}"
          format: "table"
          severity: "CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

      - name: Enviar imagem para o Amazon ECR
        run: |
          docker push ${{ steps.vars.outputs.ecr_uri }}:${{ steps.vars.outputs.image_tag }}
          docker push ${{ steps.vars.outputs.ecr_uri }}:latest

      - name: "GitOps CD — Atualizar tag da imagem no manifesto Kubernetes"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            sed -i "s|image: .*/flag-service:.*|image: ${{ steps.vars.outputs.ecr_uri }}:${{ steps.vars.outputs.image_tag }}|g" gitops/flag-service/deployment.yaml
            git add gitops/flag-service/deployment.yaml
            if git diff --staged --quiet; then
              echo "Nenhuma alteração necessária no manifesto."
              break
            fi
            git commit -m "chore(gitops): update flag-service image to ${{ steps.vars.outputs.image_tag }} [skip ci]"
            if git push origin HEAD:main; then
              echo "Manifesto GitOps atualizado com sucesso!"
              break
            fi
            git reset --hard origin/main
            sleep 3
          done
