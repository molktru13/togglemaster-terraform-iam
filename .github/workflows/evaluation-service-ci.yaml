name: "CI/CD DevSecOps — evaluation-service (Go)"

on:
  push:
    branches: [ "main" ]
    paths:
      - "evaluation-service/**"
      - ".github/workflows/evaluation-service-ci.yaml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "evaluation-service/**"
      - ".github/workflows/evaluation-service-ci.yaml"
  workflow_dispatch:

permissions:
  contents: write

env:
  SERVICE_NAME: evaluation-service
  AWS_REGION: us-east-1
  GO_VERSION: "1.23"

jobs:
  # ============================================================================
  # ESTÁGIO 1: Build & Unit Test
  # ============================================================================
  build-and-unit-test:
    name: "1. Build & Unit Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./evaluation-service
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: evaluation-service/go.sum

      - name: Baixar dependências e compilar binário
        run: |
          go mod download
          CGO_ENABLED=0 go build -v -o evaluation-service .

      - name: Executar Testes Unitários
        run: go test -v -race ./...

  # ============================================================================
  # ESTÁGIO 2: Linter / Static Analysis (golangci-lint)
  # ============================================================================
  linter-static-analysis:
    name: "2. Linter / Static Analysis (golangci-lint)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./evaluation-service
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: evaluation-service/go.sum

      - name: Rodar golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: evaluation-service

  # ============================================================================
  # ESTÁGIO 3: Security Scan — SAST (Gosec) & SCA (Trivy FS)
  # Regra de Bloqueio: Falha se vulnerabilidade CRÍTICA/ALTA for encontrada
  # ============================================================================
  security-scan-sast-sca:
    name: "3. Security Scan (SAST Gosec & SCA Trivy)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: evaluation-service/go.sum

      - name: "SAST — Gosec (Static Application Security Testing)"
        working-directory: ./evaluation-service
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity high -confidence high ./...

      - name: "SCA — Trivy FS Scan (Bloqueio em Vulnerabilidades CRITICAL)"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "./evaluation-service"
          scanners: "vuln"
          severity: "CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

  # ============================================================================
  # ESTÁGIO 4: Docker Build, Container Scan (Trivy), Push ECR & GitOps Update
  # ============================================================================
  docker-build-push-gitops:
    name: "4. Docker Build, Trivy Image Scan, Push ECR & GitOps"
    runs-on: ubuntu-latest
    needs:
      - build-and-unit-test
      - linter-static-analysis
      - security-scan-sast-sca
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout do repositório completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Gerar tag imutável com Commit Hash (v1.0.0-sha)
        id: vars
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_TAG="v1.0.0-${SHORT_SHA}"
          ECR_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.SERVICE_NAME }}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "ecr_uri=${ECR_URI}" >> $GITHUB_OUTPUT

      - name: Construir imagem Docker
        working-directory: ./evaluation-service
        run: |
          docker build -t ${{ steps.vars.outputs.ecr_uri }}:${{ steps.vars.outputs.image_tag }} \
                       -t ${{ steps.vars.outputs.ecr_uri }}:latest .

      - name: "Container Scan — Trivy Image (Bloqueio em CRITICAL)"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ steps.vars.outputs.ecr_uri }}:${{ steps.vars.outputs.image_tag }}"
          format: "table"
          severity: "CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

      - name: Enviar imagem para o Amazon ECR
        run: |
          docker push ${{ steps.vars.outputs.ecr_uri }}:${{ steps.vars.outputs.image_tag }}
          docker push ${{ steps.vars.outputs.ecr_uri }}:latest

      - name: "GitOps CD — Atualizar tag da imagem no manifesto Kubernetes"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            sed -i "s|image: .*/evaluation-service:.*|image: ${{ steps.vars.outputs.ecr_uri }}:${{ steps.vars.outputs.image_tag }}|g" gitops/evaluation-service/deployment.yaml
            git add gitops/evaluation-service/deployment.yaml
            if git diff --staged --quiet; then
              echo "Nenhuma alteração necessária no manifesto."
              break
            fi
            git commit -m "chore(gitops): update evaluation-service image to ${{ steps.vars.outputs.image_tag }} [skip ci]"
            if git push origin HEAD:main; then
              echo "Manifesto GitOps atualizado com sucesso!"
              break
            fi
            git reset --hard origin/main
            sleep 3
          done
